<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文小测</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文小测">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8c1515">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #1f1d1a; --muted: #6f6a62;
    --line: #e7e1d7; --accent: #8c1515; --accent-soft: #f6e9e9;
    --good: #2f7d4f; --good-soft: #e6f3eb; --bad: #b3261e; --bad-soft: #fbeae9;
    --shaky: #9a6a00; --shaky-soft: #fbf2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --card: #211f1c; --ink: #f1ede6; --muted: #a39d93;
      --line: #36322d; --accent: #e07a7a; --accent-soft: #3a2424;
      --good: #7fcf9c; --good-soft: #1f3327; --bad: #f08c85; --bad-soft: #3a2220;
      --shaky: #e6c070; --shaky-soft: #362d17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 22px; margin: 4px 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 16px 0 20px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .02em;
         color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
  .count { float: right; color: var(--muted); font-size: 13px; }
  .instr { color: var(--muted); font-size: 14px; margin: 12px 0 4px; }
  .prompt { font-size: 19px; margin: 6px 0 16px; white-space: pre-wrap; }
  textarea {
    width: 100%; min-height: 84px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .choice.right { background: var(--good-soft); border-color: var(--good); }
  .choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .choice:disabled { cursor: default; }
  .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--accent); color: #fff; cursor: pointer; width: 100%; margin-top: 14px;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .grade button { font: inherit; font-size: 15px; font-weight: 600; border-radius: 10px; padding: 11px 6px; cursor: pointer; border: 1px solid; }
  .g-right { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .g-shaky { background: var(--shaky-soft); color: var(--shaky); border-color: var(--shaky); }
  .g-wrong { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .reveal { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .reveal .ans { font-size: 18px; font-weight: 600; }
  .reveal .alt { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .reveal .note { margin-top: 10px; font-size: 15px; }
  .reveal .yours { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .hidden { display: none; }
  .diff { margin: 10px 0 4px; font-size: 15px; line-height: 1.7; }
  .diff .lbl { color: var(--muted); font-size: 12px; font-weight: 600; margin-right: 4px; }
  .diff del { color: var(--bad); background: var(--bad-soft); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
  .diff ins { color: var(--good); background: var(--good-soft); text-decoration: none; font-weight: 600; border-radius: 3px; padding: 0 2px; }
  .check { font-size: 14px; margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; }
  .check.ok { background: var(--good-soft); color: var(--good); }
  .check.no { background: var(--bad-soft); color: var(--bad); }
  .check.tip { background: var(--shaky-soft); color: var(--shaky); }
  .grade button.suggest { outline: 3px solid currentColor; outline-offset: 2px; }
  .suggest-lbl { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .ask { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); }
  .ask .lbl { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .ask textarea { min-height: 56px; font-size: 15px; background: var(--card); }
  .ask .btn { margin-top: 8px; padding: 10px 14px; font-size: 15px; }
  .ask .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .summary h2 { margin: 0 0 6px; font-size: 22px; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 10px; }
  .review { margin: 16px 0 0; padding: 0; list-style: none; }
  .review li { border-top: 1px solid var(--line); padding: 12px 0; font-size: 15px; }
  .review .r { font-size: 12px; font-weight: 700; margin-right: 6px; }
  .copybox { width: 100%; min-height: 90px; font: 13px/1.4 ui-monospace, Menlo, monospace; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .tools { margin-top: 22px; }
  .ctx { font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
  .toks { font-size: 19px; line-height: 2.1; margin: 8px 0 14px; }
  .tok { display: inline; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 2px dotted var(--line); padding: 1px 2px; margin: 0 1px; cursor: pointer; border-radius: 4px; }
  .tok.sel { background: var(--accent-soft); border-bottom-color: var(--accent); }
  .tok.found { background: var(--good-soft); color: var(--good); border-bottom-color: var(--good); }
  .tok.missed { background: var(--shaky-soft); color: var(--shaky); border-bottom-color: var(--shaky); }
  .tok.bad { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
  .fixq { margin: 14px 0 6px; font-size: 15px; }
  .fixq b { color: var(--bad); }
  .legend { font-size: 12px; color: var(--muted); }
  .tpl { font-size: 19px; line-height: 2.2; margin: 8px 0 12px; }
  .blank { font: inherit; font-size: 17px; width: 7.5em; padding: 2px 6px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 4px; }
  .blank.ok { border-bottom-color: var(--good); background: var(--good-soft); }
  .blank.no { border-bottom-color: var(--bad); background: var(--bad-soft); }
  .fixans { font-size: 13px; color: var(--good); font-weight: 600; margin: 0 4px; }
  .verdict { font-size: 15px; font-weight: 700; margin-top: 12px; }
  .jot { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .jot h3 { margin: 0 0 8px; font-size: 16px; }
  .jot input, .jot textarea { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
  .jot textarea { min-height: 48px; }
  .jot .row { display: flex; gap: 8px; }
  .jot .row .btn { margin-top: 0; flex: 1; padding: 10px; font-size: 15px; }
  .jot .saved { font-size: 13px; color: var(--good); margin-top: 6px; }
  .tools .btn { font-size: 15px; }
  .stats { display: flex; gap: 8px; margin: 12px 0 0; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--muted); }
  .again-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--bad); background: var(--bad-soft); padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
  .past { margin-top: 28px; }
  .past h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .past a { display: block; color: var(--ink); text-decoration: none; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .past a.on { color: var(--accent); font-weight: 600; }
  .past .done { float: right; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">英文小测</h1>
    <p id="subtitle"></p>
  </header>
  <div class="bar"><div id="progress"></div></div>

  <div id="quiz" class="card"></div>

  <div id="tools" class="tools"></div>
</div>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---- answer checking: word diff + key phrase + known traps ----
const norm = s => String(s || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"')
  .replace(/[^a-z0-9'\s-]/g, " ").replace(/\s+/g, " ").trim();
const toks = s => norm(s).split(" ").filter(Boolean);

function lcsMarks(a, b) {
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const inA = new Array(n).fill(false), inB = new Array(m).fill(false);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (a[i] === b[j]) { inA[i] = inB[j] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { inA, inB, ratio: (n + m) ? 2 * dp[0][0] / (n + m) : 0 };
}

function checkAnswer(q, yours) {
  const targets = [q.answer, ...(q.alternatives || [])];
  const u = toks(yours);
  let best = null;
  for (const t of targets) {
    const tt = toks(t), r = lcsMarks(u, tt);
    if (!best || r.ratio > best.ratio) best = { ...r, t: tt, raw: t };
  }
  const exact = targets.some(t => norm(t) === norm(yours));
  const padded = " " + norm(yours) + " ";
  const keys = (q.key ? [].concat(q.key) : []).map(k => ({ k, ok: padded.includes(" " + norm(k) + " ") }));
  const traps = (q.traps || []).filter(t => { try { return new RegExp(t.re, "i").test(yours); } catch (_) { return false; } });
  const keysOk = keys.every(k => k.ok);
  let suggest = "wrong";
  if (exact || (keysOk && !traps.length && best.ratio >= 0.85)) suggest = "right";
  else if ((keys.length && keysOk) || best.ratio >= 0.6) suggest = "shaky";
  return { best, exact, keys, traps, suggest };
}

function feedbackHtml(q, yours) {
  if (!yours.trim()) return "";
  const c = checkAnswer(q, yours);
  if (c.exact) return `<div class="check ok">✓ 和参考答案完全一致</div>`;
  const mine = toks(yours).map((w, i) => c.best.inA[i] ? esc(w) : `<del>${esc(w)}</del>`).join(" ");
  const ref = c.best.t.map((w, i) => c.best.inB[i] ? esc(w) : `<ins>${esc(w)}</ins>`).join(" ");
  let out = `<div class="diff"><span class="lbl">你写的</span>${mine}<br><span class="lbl">对照</span>${ref}</div>`;
  for (const k of c.keys) out += k.ok
    ? `<div class="check ok">✓ 关键表达用对了：${esc(k.k)}</div>`
    : `<div class="check no">✗ 关键表达没用上：${esc(k.k)}</div>`;
  for (const t of c.traps) out += `<div class="check tip">⚠︎ ${esc(t.tip)}</div>`;
  return out;
}

// ---- "问 Claude": open the Claude app with this question pre-filled ----
function askBoxHtml() {
  return `<div class="ask"><div class="lbl">💬 对这道题还有疑问？</div>
    <textarea class="askq" placeholder="比如：我用 since 可以吗？"></textarea>
    <button class="btn ghost askbtn">问 Claude</button>
    <div class="hint">会打开 Claude App 并自动带上题目和你的答案（同时已复制到剪贴板，没带上就粘贴）</div></div>`;
}

function wireAsk(root, q, yours) {
  const btn = root.querySelector(".askbtn");
  if (!btn) return;
  btn.onclick = async () => {
    const question = root.querySelector(".askq").value.trim() || "请帮我看看我的答案哪里可以更好。";
    const lines = [
      "我在做英文小测，想请你像一位严格但友善的英文编辑一样帮我解答（请用中文回答，例句用英文）。",
      `题目：${q.prompt}`,
      q.choices ? `选项：${q.choices.join(" / ")}` : "",
      `参考答案：${q.answer}`,
      q.alternatives && q.alternatives.length ? `也可以说：${q.alternatives.join(" / ")}` : "",
      q.note ? `讲解：${q.note}` : "",
      yours ? `我的答案：${yours}` : "",
      `我的问题：${question}`,
      "最后请用一行“📌 生词本：……”总结我该记住的点（英文表达 + 中文说明）。"
    ].filter(Boolean).join("\n");
    try { await navigator.clipboard.writeText(lines); } catch (_) {}
    window.location.href = "https://claude.ai/new?q=" + encodeURIComponent(lines);
  };
}

// Quizzes are AES-GCM encrypted; the key lives only on the user's devices.
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));

async function decrypt(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", fromB64(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(blob.iv) }, key, fromB64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function askForKey(message) {
  document.getElementById("quiz").innerHTML = `<p>${message}</p>
    <textarea id="keyin" placeholder="粘贴邮件里的钥匙" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="btn" id="keybtn">解锁</button>`;
  document.getElementById("keybtn").onclick = () => {
    const k = document.getElementById("keyin").value.trim().replace(/^.*#k=/, "");
    if (k) { localStorage.setItem("quizKey", k); boot(); }
  };
}

async function boot() {
  const m = location.hash.match(/k=([\w-]+)/);
  if (m) {
    localStorage.setItem("quizKey", m[1]);
    history.replaceState(null, "", location.pathname + location.search);
  }
  const keyText = localStorage.getItem("quizKey");
  if (!keyText) return askForKey("这是私人测验，需要钥匙才能打开。<br>第一次使用：把邮件里的钥匙粘贴到下面。");
  let blob;
  try { blob = await (await fetch("quizzes/bank.enc.json", { cache: "no-store" })).json(); }
  catch (_) { document.getElementById("quiz").innerHTML = "<p>题库加载失败，请检查网络后重新打开。</p>"; return; }
  let bank;
  try { bank = await decrypt(blob, keyText); }
  catch (_) { localStorage.removeItem("quizKey"); return askForKey("钥匙不对，请重新粘贴一次。"); }
  start(bank.questions);
}

// ---- spaced repetition (Ebbinghaus-style intervals) ----
const DAY = 86400000, MIN = 60000;
const INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60];   // days, indexed by box
const NEW_PER_DAY = 10;
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const today = () => new Date().toDateString();

const TYPE_LABEL = {
  recall:    ["看意思写英文", "根据中文或释义，写出地道的英文说法。"],
  chinglish: ["改写 Chinglish", "把这句话改得更地道、更像母语记者会写的。"],
  cloze:     ["语境填空", "选出最适合填进空格的词。"],
  synonym:   ["辨析近义词", "选出在这个语境里最准确的一个。"],
  spot:      ["找错改错", "点出你觉得有问题的词（可以点好几个），再点“检查”。"],
  fill:      ["句子填空", "只填空格里的词。想不起来可以点“提示”。"]
};

function start(questions) {
  const byId = Object.fromEntries(questions.map(q => [q.id, q]));
  let srs = load("srs", {});          // id -> {box, due, lapses, last}
  let lastId = null;

  function dailyNew() {
    const d = load("daily", {});
    return d.date === today() ? d : { date: today(), newDone: 0, extra: 0, done: 0 };
  }
  function grade(q, result, yours) {
    const now = Date.now(), s = srs[q.id] || { box: 0, lapses: 0 };
    const wasNew = !srs[q.id];
    if (result === "right") { s.box = Math.min(s.box + 1, INTERVALS.length - 1); s.due = now + INTERVALS[s.box] * DAY; }
    else if (result === "shaky") { s.box = Math.max(1, s.box); s.due = now + DAY; }
    else { s.box = 0; s.lapses = (s.lapses || 0) + 1; s.due = now + 10 * MIN; }
    s.last = now; srs[q.id] = s; save("srs", srs);
    const d = dailyNew(); if (wasNew) d.newDone++; d.done++; save("daily", d);
    const log = load("log", []);
    log.push({ id: q.id, t: now, result, yours: (yours || "").slice(0, 300) });
    save("log", log.slice(-500));
    lastId = q.id;
  }
  function counts() {
    const now = Date.now(), d = dailyNew();
    const due = questions.filter(q => srs[q.id] && srs[q.id].due <= now);
    const unseen = questions.filter(q => !srs[q.id]);
    const newLeft = Math.max(0, NEW_PER_DAY + d.extra - d.newDone);
    const mastered = questions.filter(q => srs[q.id] && srs[q.id].box >= 4).length;
    return { due, unseen, newLeft, mastered, d };
  }
  function pick() {
    const c = counts();
    const due = c.due.filter(q => q.id !== lastId || c.due.length === 1).sort((a, b) => srs[a.id].due - srs[b.id].due);
    if (due.length) return due[0];
    if (c.newLeft > 0 && c.unseen.length) return c.unseen[0];
    return null;
  }

  function header() {
    const c = counts();
    document.getElementById("subtitle").textContent =
      `今天已做 ${c.d.done} 题 · 待复习 ${c.due.length} · 今日新题还剩 ${Math.min(c.newLeft, c.unseen.length)}`;
    document.getElementById("progress").style.width = (questions.length ? c.mastered / questions.length * 100 : 0) + "%";
    const log = load("log", []), sent = load("sentUpTo", 0);
    const pending = log.filter(x => x.t > sent).length + load("notes", []).filter(n => n.t > sent).length;
    const notes = load("notes", []), unsentNotes = notes.filter(n => n.t > sent).length;
    document.getElementById("tools").innerHTML = `
      <div class="jot"><h3>✍️ 随手记</h3>
        <input id="jotText" placeholder="听到或看到的词、句子，或想问的中文说法" autocapitalize="off" autocorrect="off" spellcheck="false">
        <textarea id="jotCtx" placeholder="（可选）在哪里遇到的？比如：点菜时服务员说的"></textarea>
        <button class="btn" id="jotSave" style="margin-top:0">保存</button>
        <div class="saved" id="jotMsg">${unsentNotes ? `已存 ${unsentNotes} 条，周五会一起发给 Claude` : "存下来的词，周五会随答题记录一起发给 Claude，周六出题"}</div>
        <a href="#" id="jotAsk" style="display:block;margin-top:8px;font-size:14px;color:var(--accent)">想马上知道意思？保存后用手机 Claude 查一下 →</a>
        <div class="muted" style="font-size:12px">（手机 Claude 的解释 Mac 上的 Claude 看不到，但你存的词会收到）</div>
      </div>
      <div class="stats">
        <div class="stat"><b>${questions.length}</b><span>题库总数</span></div>
        <div class="stat"><b>${Object.keys(srs).length}</b><span>做过</span></div>
        <div class="stat"><b>${c.mastered}</b><span>已掌握</span></div>
      </div>
      <button class="btn" id="mail">📧 把答题记录和随手记发给 Claude${pending ? `（${pending} 条新记录）` : ""}</button>
      <div id="mailConfirm"></div>
      <button class="btn ghost" id="export" style="font-size:14px;padding:9px">📋 改用复制（发邮件不方便时）</button>
      <div class="muted" style="margin-top:6px">红色进度条 = 已掌握的比例（连续答对 4 次以上）</div>`;
    document.getElementById("export").onclick = () => exportLog("copy");
    document.getElementById("mail").onclick = () => exportLog("mail");
    const jot = ask => {
      const text = document.getElementById("jotText").value.trim();
      if (!text) { document.getElementById("jotText").focus(); return; }
      const ctx = document.getElementById("jotCtx").value.trim();
      const all = load("notes", []); all.push({ t: Date.now(), text, ctx }); save("notes", all.slice(-300));
      if (ask) {
        const lines = ["我在生活中遇到一个英文表达，请像一位英文老师一样用中文给我讲清楚（意思、语气/场合、常见搭配、一两个例句；如果我写的是中文，就告诉我地道的英文说法）。",
          `表达：${text}`, ctx ? `场景：${ctx}` : "",
          "最后请用一行“📌 生词本：……”总结（英文表达 + 中文说明）。"].filter(Boolean).join("\n");
        try { navigator.clipboard.writeText(lines); } catch (_) {}
        window.location.href = "https://claude.ai/new?q=" + encodeURIComponent(lines);
      } else header();
    };
    document.getElementById("jotSave").onclick = () => jot(false);
    document.getElementById("jotAsk").onclick = e => { e.preventDefault(); jot(true); };
  }

  function exportLog(mode) {
    const log = load("log", []), sent = load("sentUpTo", 0);
    const items = log.filter(x => x.t > sent && byId[x.id]);
    const notes = load("notes", []).filter(n => n.t > sent);
    if (!items.length && !notes.length) { alert("没有新的记录。"); return; }
    const mark = { right: "✓", shaky: "△", wrong: "✗" };
    const noteText = notes.length ? "\n\n随手记（请解释并记进生词本）\n" + notes.map((n, k) =>
      `${k + 1}. ${n.text}${n.ctx ? "（" + n.ctx + "）" : ""}`).join("\n") : "";
    const text = "手机APP答题记录\n" + items.map((x, k) => {
      const q = byId[x.id];
      return `${k + 1}. ${mark[x.result]} [${x.result}] ${q.answer}${q.entry_id ? " (" + q.entry_id + ")" : ""}` +
        (x.result !== "right" && x.yours && x.yours.trim() ? `\n   我写的：${x.yours.trim()}` : "");
    }).join("\n") + noteText;
    const lastT = Math.max(...items.map(x => x.t), ...notes.map(n => n.t));
    if (mode === "mail") {
      const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      window.location.href = "mailto:yujiang7@stanford.edu?subject=" + encodeURIComponent(`英文小测记录 ${stamp}`) +
        "&body=" + encodeURIComponent(text + "\n\n（手机APP自动生成，Claude 会在周六读取）");
      document.getElementById("mailConfirm").innerHTML = `<div class="muted" style="margin:8px 0 4px">邮件发出去了吗？</div>
        <div class="row" style="display:flex;gap:8px"><button class="btn" id="sentYes" style="flex:1;margin-top:0">发出去了</button>
        <button class="btn ghost" id="sentNo" style="flex:1;margin-top:0">没有</button></div>`;
      document.getElementById("sentYes").onclick = () => { save("sentUpTo", lastT); header(); };
      document.getElementById("sentNo").onclick = () => { document.getElementById("mailConfirm").innerHTML = `<div class="muted">没关系，记录还在。可以再点一次，或者用下面的“复制”。</div>`; };
      return;
    }
    const done = () => { save("sentUpTo", lastT); header(); alert("已复制！回到 Mac 上的 Claude，粘贴发给我就行。"); };
    navigator.clipboard.writeText(text).then(done, () => {
      document.getElementById("tools").insertAdjacentHTML("beforeend",
        `<textarea class="copybox" readonly>${esc(text)}</textarea><div class="muted">自动复制失败：长按上面的文字 → 全选 → 拷贝。</div>`);
      save("sentUpTo", lastT);
    });
  }

  function revealBlock(q, yours) {
    const alts = (q.alternatives && q.alternatives.length)
      ? `<div class="alt">也可以说：${q.alternatives.map(esc).join(" / ")}</div>` : "";
    const mine = yours !== undefined && !yours.trim() ? `<div class="yours">你的答案：（空）</div>` : "";
    const fb = yours !== undefined ? feedbackHtml(q, yours) : "";
    const note = q.note ? `<div class="note">${esc(q.note)}</div>` : "";
    return `<div class="reveal">${mine}<div class="ans">${esc(q.answer)}</div>${alts}${fb}${note}</div>`;
  }

  function doneScreen() {
    const c = counts(), el = document.getElementById("quiz");
    const next = questions.filter(q => srs[q.id]).map(q => srs[q.id].due).sort((a, b) => a - b)[0];
    const when = next ? (next - Date.now() < DAY ? "今天稍后" : new Date(next).toLocaleDateString("zh-CN", { month: "long", day: "numeric" })) : "";
    el.innerHTML = `<h2 style="margin:0 0 6px">今天的题做完啦 🎉</h2>
      <p class="muted">${when ? `下一道复习题：${when}。` : ""}${c.unseen.length ? `题库里还有 ${c.unseen.length} 道新题。` : "题库里的新题都做过了，周六会加新题。"}</p>
      ${c.unseen.length ? `<button class="btn" id="more">再来 5 道新题</button>` : ""}`;
    const more = document.getElementById("more");
    if (more) more.onclick = () => { const d = dailyNew(); d.extra += 5; save("daily", d); render(); };
  }

  function render() {
    header();
    const q = pick();
    if (!q) return doneScreen();
    const [label, instr] = TYPE_LABEL[q.type] || ["练习", ""];
    const s = srs[q.id];
    const badge = !s ? `<span class="count">新题</span>` : `<span class="count">复习</span>${s.lapses ? `<span class="again-tag">之前错过 ${s.lapses} 次</span>` : ""}`;
    const el = document.getElementById("quiz");
    const head = `<span class="tag">${label}</span>${badge}
      <div class="instr">${esc(q.instruction || instr)}</div>
      <div class="prompt">${esc(q.prompt)}</div>`;

    const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
    const VERDICT = { right: ["全对 ✓", "var(--good)"], shaky: ["差一点 △", "var(--shaky)"], wrong: ["再接再厉 ✗", "var(--bad)"] };
    const finishCard = (result, yours) => {
      grade(q, result, yours);
      const [vt, vc] = VERDICT[result];
      const alts = (q.alternatives && q.alternatives.length) ? `<div class="alt">也可以说：${q.alternatives.map(esc).join(" / ")}</div>` : "";
      document.getElementById("after").insertAdjacentHTML("beforeend",
        `<div class="verdict" style="color:${vc}">${vt}</div>
         <div class="reveal"><div class="ans">${esc(q.answer)}</div>${alts}${q.note ? `<div class="note">${esc(q.note)}</div>` : ""}</div>` +
        askBoxHtml() + `<button class="btn" id="next">下一题</button>`);
      wireAsk(document.getElementById("after"), q, yours);
      document.getElementById("next").onclick = render;
      header();
    };

    if (q.type === "spot") {
      const sent = q.sentence, toks = [];
      sent.replace(/\S+/g, (w, at) => { toks.push({ w, a: at, b: at + w.length }); return w; });
      const spans = q.errors.map(e => { const a = sent.indexOf(e.wrong); return { ...e, a, b: a + e.wrong.length }; });
      const errOf = t => spans.findIndex(sp => t.a < sp.b && t.b > sp.a);
      el.innerHTML = `<span class="tag">${label}</span>${badge}
        <div class="instr">${esc(instr)}</div>
        ${q.context ? `<div class="ctx">${esc(q.context)}</div>` : ""}
        <div class="toks">${toks.map((t, k) => `<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join(" ")}</div>
        <button class="btn" id="check">检查</button><div id="after"></div>`;
      const sel = new Set();
      el.querySelectorAll(".tok").forEach(b => b.onclick = () => {
        const k = +b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle("sel");
      });
      document.getElementById("check").onclick = () => {
        document.getElementById("check").remove();
        const found = spans.map(() => false); let badTaps = 0;
        el.querySelectorAll(".tok").forEach(b => {
          const k = +b.dataset.k, e = errOf(toks[k]); b.disabled = true; b.classList.remove("sel");
          if (e >= 0) { if (sel.has(k)) found[e] = true; }
          else if (sel.has(k)) { b.classList.add("bad"); badTaps++; }
        });
        el.querySelectorAll(".tok").forEach(b => { const e = errOf(toks[+b.dataset.k]); if (e >= 0) b.classList.add(found[e] ? "found" : "missed"); });
        const nFound = found.filter(Boolean).length;
        document.getElementById("after").innerHTML = `<div class="legend">绿色 = 你找到的错误 · 橙色 = 漏掉的错误 · 红色划线 = 其实没问题</div>
          <div class="muted" style="margin-top:6px">共 ${spans.length} 处错误，你找到了 ${nFound} 处。现在逐个改：</div><div id="fixes"></div>`;
        const fixRight = [];
        const askFix = i => {
          if (i >= spans.length) {
            const allFix = fixRight.every(Boolean), allFound = nFound === spans.length;
            const result = allFix && allFound && !badTaps ? "right" : (fixRight.filter(Boolean).length >= spans.length / 2 ? "shaky" : "wrong");
            return finishCard(result, `找到 ${nFound}/${spans.length} 处；改对 ${fixRight.filter(Boolean).length}/${spans.length} 处`);
          }
          const sp = spans[i], box = document.getElementById("fixes");
          box.insertAdjacentHTML("beforeend", `<div class="fixq">${spans.length > 1 ? `第 ${i + 1} 处：` : ""}<b>${esc(sp.wrong)}</b> 应该改成</div>
            <div class="choices" id="fix${i}">${shuffle(sp.options).map(o => `<button class="choice">${esc(o)}</button>`).join("")}</div>`);
          document.querySelectorAll(`#fix${i} .choice`).forEach(b => b.onclick = () => {
            const ok = b.textContent === sp.right; fixRight[i] = ok;
            document.querySelectorAll(`#fix${i} .choice`).forEach(x => { x.disabled = true; if (x.textContent === sp.right) x.classList.add("right"); });
            if (!ok) b.classList.add("wrong");
            askFix(i + 1);
          });
        };
        askFix(0);
      };
    } else if (q.type === "fill") {
      let bi = 0;
      const html = esc(q.template).replace(/\{([^}]+)\}/g, () => `<input class="blank" data-i="${bi++}" autocapitalize="off" autocorrect="off" spellcheck="false">`);
      el.innerHTML = head + `<div class="tpl">${html}</div>
        <div class="row" style="display:flex;gap:8px"><button class="btn ghost" id="hint" style="flex:1">提示</button><button class="btn" id="check" style="flex:2">检查</button></div>
        <div id="after"></div>`;
      let usedHint = false;
      document.getElementById("hint").onclick = () => {
        usedHint = true;
        el.querySelectorAll(".blank").forEach(inp => {
          const a = q.blanks[+inp.dataset.i].answer;
          inp.placeholder = a.split(" ").map(w => w[0] + "_".repeat(Math.max(0, w.length - 1))).join(" ");
        });
      };
      document.getElementById("check").onclick = () => {
        el.querySelectorAll(".row").forEach(r => r.remove());
        let nOk = 0; const typed = [];
        el.querySelectorAll(".blank").forEach(inp => {
          const bl = q.blanks[+inp.dataset.i], v = inp.value;
          const ok = [bl.answer, ...(bl.alts || [])].some(x => norm(x) === norm(v));
          inp.disabled = true; inp.classList.add(ok ? "ok" : "no"); typed.push(v || "（空）");
          if (ok) nOk++; else inp.insertAdjacentHTML("afterend", `<span class="fixans">→ ${esc(bl.answer)}</span>`);
        });
        const n = q.blanks.length;
        const result = nOk === n ? (usedHint ? "shaky" : "right") : (nOk >= n / 2 ? "shaky" : "wrong");
        finishCard(result, typed.join(" / "));
      };
    } else if (q.choices && q.choices.length) {
      el.innerHTML = head + `<div class="choices">${
        q.choices.map((c, k) => `<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")
      }</div><div id="after"></div>`;
      el.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        const picked = q.choices[+b.dataset.k], ok = picked === q.answer;
        el.querySelectorAll(".choice").forEach(x => {
          x.disabled = true;
          if (q.choices[+x.dataset.k] === q.answer) x.classList.add("right");
        });
        if (!ok) b.classList.add("wrong");
        grade(q, ok ? "right" : "wrong", picked);
        const note = q.note ? `<div class="reveal"><div class="note">${esc(q.note)}</div></div>` : "";
        document.getElementById("after").innerHTML = note + askBoxHtml() + `<button class="btn" id="next">下一题</button>`;
        wireAsk(document.getElementById("after"), q, picked);
        document.getElementById("next").onclick = render;
        header();
      });
    } else {
      el.innerHTML = head + `<textarea id="input" placeholder="先自己写，再看答案" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <button class="btn" id="show">看答案</button><div id="after"></div>`;
      document.getElementById("show").onclick = () => {
        const yours = document.getElementById("input").value;
        document.getElementById("show").remove();
        const sug = yours.trim() ? checkAnswer(q, yours).suggest : "wrong";
        const sugText = { right: "写对了", shaky: "差一点", wrong: "没想起来" }[sug];
        document.getElementById("after").innerHTML = revealBlock(q, yours) + askBoxHtml() +
          `<div class="suggest-lbl">建议打分：${sugText}（可以自己改）</div>
           <div class="grade">
             <button class="g-right" data-r="right">写对了</button>
             <button class="g-shaky" data-r="shaky">差一点</button>
             <button class="g-wrong" data-r="wrong">没想起来</button>
           </div>`;
        wireAsk(document.getElementById("after"), q, yours);
        document.querySelector(`.grade [data-r="${sug}"]`).classList.add("suggest");
        document.querySelectorAll(".grade button").forEach(b => b.onclick = () => { grade(q, b.dataset.r, yours); render(); });
      };
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  render();
}

boot();
</script>
</body>
</html>
